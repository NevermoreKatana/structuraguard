[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "structuraguard"
version = "0.3.0"
description = "Встраиваемый SDK для безопасного импорта данных в реляционные БД"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13,<3",
    "charset-normalizer>=3.4,<4",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.optional-dependencies]
xml = ["defusedxml>=0.7.1,<1"]
yaml = ["PyYAML>=6.0.3,<7"]
postgres = [
    "SQLAlchemy>=2.0.40,<3",
    "asyncpg>=0.30,<1",
    "psycopg>=3.2,<4",
]
pdf = [
    "PyMuPDF>=1.26,<2",
]
excel = [
    "openpyxl>=3.1.5,<4",
    "defusedxml>=0.7.1,<1",
]
office = [
    "python-docx>=1.1.2,<2",
    "defusedxml>=0.7.1,<1",
]
litellm = [
    "litellm>=1.75,<2",
]
tika = [
    "httpx>=0.28.1,<1",
    "httpcore==1.0.9",
    "defusedxml>=0.7.1,<1",
]
all = [
    "defusedxml>=0.7.1,<1",
    "PyYAML>=6.0.3,<7",
    "SQLAlchemy>=2.0.40,<3",
    "asyncpg>=0.30,<1",
    "psycopg>=3.2,<4",
    "PyMuPDF>=1.26,<2",
    "openpyxl>=3.1.5,<4",
    "python-docx>=1.1.2,<2",
    "litellm>=1.75,<2",
    "httpx>=0.28.1,<1",
    "httpcore==1.0.9",
]

[project.urls]
Repository = "https://github.com/NevermoreKatana/structuraguard"
Documentation = "https://nevermorekatana.github.io/structuraguard/"

[tool.hatch.build.targets.wheel]
packages = ["src/structuraguard"]

[tool.hatch.build.targets.sdist]
include = [
    "/pyproject.toml",
    "/src",
]
exclude = [
    "**/.DS_Store",
    "**/__pycache__/**",
    "**/*.py[cod]",
]
