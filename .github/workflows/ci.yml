name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  UV_NO_PROGRESS: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.27"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Check lockfile
        run: uv lock --check
      - name: Sync environment
        run: uv sync --all-packages --locked --group dev --group docs
      - name: Run quality gates
        run: make lint typecheck docs

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.27"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Check lockfile
        run: uv lock --check
      - name: Sync environment
        run: uv sync --all-packages --locked --group dev
      - name: Run tests
        run: make test

  database:
    name: PostgreSQL inspection
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.27"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync DB environment
        run: uv lock --check
      - name: Install DB dependencies
        run: uv sync --all-packages --locked --group dev --extra postgres --extra sqlite
      - name: Verify Docker
        run: docker info
      - name: Test real PostgreSQL
        run: make test-database

  package:
    name: Package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.27"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Check lockfile
        run: uv lock --check
      - name: Sync environment
        run: uv sync --all-packages --locked --group dev
      - name: Verify wheel and sdist
        run: make test-build
