[build-system]
requires = []
build-backend = "workspace_build_guard"
backend-path = ["scripts"]

[tool.uv]
package = false
required-version = "==0.9.27"

[tool.uv.workspace]
members = ["packages/structuraguard"]

[dependency-groups]
dev = [
    "anyio>=4.11,<5",
    "hatchling>=1.28,<2",
    "mypy>=2.3,<3",
    "pytest>=8.4,<10",
    "ruff>=0.14,<1",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
]

[tool.ruff]
target-version = "py312"
line-length = 88
include = ["*.py", "*.pyi"]
src = ["packages/structuraguard/src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["structuraguard"]

[tool.ruff.lint.per-file-ignores]
"packages/structuraguard/tests/smoke/import_probe.py" = ["B010"]
"packages/structuraguard/tests/unit/test_config.py" = ["B010"]
"packages/structuraguard/tests/unit/test_facades.py" = ["B009"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "packages/structuraguard/src",
    "packages/structuraguard/tests",
    "scripts/verify_distribution.py",
    "scripts/workspace_build_guard.py",
]
mypy_path = ["packages/structuraguard/src"]
show_error_codes = true
warn_unreachable = true
pretty = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["packages/structuraguard/tests"]
xfail_strict = true
