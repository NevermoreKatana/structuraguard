site_name: StructuraGuard SDK
site_description: Документация встраиваемого Python SDK StructuraGuard
site_url: https://nevermorekatana.github.io/structuraguard/
repo_url: https://github.com/NevermoreKatana/structuraguard
repo_name: NevermoreKatana/structuraguard
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

plugins:
  - search:
      lang:
        - ru
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

validation:
  nav:
    omitted_files: info
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - Главная: index.md
  - Требования: requirements.md
  - Архитектура: architecture.md
  - Публичный API: public-api.md
  - Database Inspector M7: database-inspection.md
  - Normalized Profiler M8: normalized-profiling.md
  - Deterministic Mapper M9: deterministic-mapping.md
  - Semantic DB Mapper M10: llm-database-mapping.md
  - Структурный разбор M5: structure.md
  - LLM providers и routing M6: llm.md
  - LLM semantic parsing M6: llm-semantic-parsing.md
  - Hybrid semantic parsing M6: semantic-parsing.md
  - Безопасность ParsePlan: security.md
  - Модель угроз: threat-model.md
  - ADR:
      - Public API и run policies: adr/0001-public-api-and-run-policies.md
      - Security boundary defaults: adr/0002-security-boundary-defaults.md
      - Двухэтапная модель parsing: adr/0003-two-stage-parsing-contracts.md
      - Lossless physical extraction: adr/0004-lossless-physical-extraction.md
      - Безопасные markup adapters: adr/0005-safe-markup-extraction.md
      - Ограниченные document adapters: adr/0006-bounded-document-adapters.md
      - Opt-in Tika egress: adr/0007-opt-in-tika-egress.md
      - Bounded structural profiling: adr/0008-bounded-structural-profiling.md
      - Deterministic structure analysis: adr/0009-deterministic-structure-analysis.md
      - Проверяемое ParsePlan execution: adr/0010-verified-parse-plan-execution.md
      - Provider foundation и disabled LLM: adr/0011-llm-provider-foundation.md
      - HTTP provider и policy-aware routing: adr/0012-policy-aware-llm-routing.md
      - Проверка LLM ParsePlan: adr/0013-validated-llm-structure-analysis.md
      - Hybrid parsing и document spans: adr/0014-hybrid-semantic-parsing.md
      - Ограниченный SQLite inspection: adr/0015-bounded-sqlite-inspection.md
      - PostgreSQL inspection в пределах scope: adr/0016-scoped-postgresql-inspection.md
      - Canonical catalog и FK graph: adr/0017-canonical-catalog-and-dependency-graph.md
      - Bounded normalized profiling: adr/0018-bounded-normalized-profiling.md
      - Deterministic mapping candidates: adr/0019-deterministic-mapping-candidates.md
      - Semantic mapping proposals: adr/0020-llm-semantic-mapping-proposals.md
  - Планы:
      - M00 — требования: plans/M00_requirements.md
      - M01 — каркас SDK: plans/M01_sdk_scaffold.md
      - M02 — domain contracts: plans/M02_domain_contracts.md
      - M03 — parser registry: plans/M03_parser_registry.md
      - M04 — technical parsers: plans/M04_technical_parsers.md
      - M04 — аудит приёмки: plans/M04_acceptance_audit.md
      - M04 — security review: plans/M04_security_review.md
      - M05 — structural parsing: plans/M05_parse_plan.md
      - M05 — аудит приёмки: plans/M05_acceptance.md
      - M05 — security review: plans/M05_security_review.md
      - M06 — LLM semantic parsing: plans/M06_llm_semantic_parsing.md
      - M07 — Database Inspector: plans/M07_database_inspector.md
      - M08 — Normalized Data Profiler: plans/M08_normalized_data_profiler.md
