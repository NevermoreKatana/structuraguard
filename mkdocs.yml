site_name: StructuraGuard SDK
site_description: Документация встраиваемого Python SDK StructuraGuard
site_url: https://nevermorekatana.github.io/structuraguard/
repo_url: https://github.com/NevermoreKatana/structuraguard
repo_name: NevermoreKatana/structuraguard
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

plugins:
  - search:
      lang:
        - ru
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

validation:
  nav:
    omitted_files: info
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - Главная: index.md
  - Требования: requirements.md
  - Архитектура: architecture.md
  - Публичный API: public-api.md
  - Security DB, audit и runners M14: security-controls.md
