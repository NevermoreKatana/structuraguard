site_name: StructuraGuard SDK
site_description: Документация встраиваемого Python SDK StructuraGuard
site_url: https://nevermorekatana.github.io/structuraguard/
repo_url: https://github.com/NevermoreKatana/structuraguard
repo_name: NevermoreKatana/structuraguard
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

plugins:
  - search:
      lang:
        - ru
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

validation:
  nav:
    omitted_files: info
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - Главная: index.md
  - Требования: requirements.md
  - Архитектура: architecture.md
  - Публичный API: public-api.md
  - Модель угроз: threat-model.md
  - ADR:
      - Public API и run policies: adr/0001-public-api-and-run-policies.md
      - Security boundary defaults: adr/0002-security-boundary-defaults.md
      - Двухэтапная модель parsing: adr/0003-two-stage-parsing-contracts.md
  - Планы:
      - M00 — требования: plans/M00_requirements.md
      - M01 — каркас SDK: plans/M01_sdk_scaffold.md
      - M02 — domain contracts: plans/M02_domain_contracts.md
