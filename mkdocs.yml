      - M09 — Deterministic Mapper: plans/M09_deterministic_mapper.md
      - M09 — приёмка: plans/M09_acceptance.md
      - M09 — security review: plans/M09_security_review.md
      - M10 — LLM database mapping: plans/M10_llm_database_mapping.md
